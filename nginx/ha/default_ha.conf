limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream mf_backend_pool {
    server backend_api_1:8000 max_fails=3 fail_timeout=10s;
    server backend_api_2:8000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream mf_backend_stable {
    server backend_api_1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream mf_backend_canary {
    server backend_api_2:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

map $http_x_release_channel $mf_backend_upstream {
    default mf_backend_stable;
    stable mf_backend_stable;
    canary mf_backend_canary;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    location = / {
        return 302 /monitor/;
    }

    location = /console {
        return 302 /monitor/;
    }

    location ^~ /console/ {
        rewrite ^/console/(.*)$ /monitor/$1 redirect;
    }

    location /health {
        proxy_pass http://mf_backend_pool/health;
    }

    location /metrics {
        proxy_pass http://mf_backend_pool/metrics;
    }

    location /dashboard {
        proxy_pass http://$mf_backend_upstream;
    }

    location /monitor {
        proxy_pass http://$mf_backend_upstream;
    }

    location /evidence/ {
        proxy_pass http://$mf_backend_upstream;
    }

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://$mf_backend_upstream;
    }
}
